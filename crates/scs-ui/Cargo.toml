[package]
name = "scs-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GTK4 + libadwaita application shell"
default-run = "shadow-creator-studio"

[[bin]]
name = "shadow-creator-studio"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.7.2", features = ["v1_5"] }
chrono.workspace = true
glib = "0.20"
gtk = { package = "gtk4", version = "0.9.6", features = ["v4_14"] }
scs-audio.workspace = true
scs-capture.workspace = true
scs-core.workspace = true
scs-diagnostics.workspace = true
scs-encoder.workspace = true
scs-ffmpeg.workspace = true
scs-library.workspace = true
scs-obs.workspace = true
scs-pipewire.workspace = true
scs-system.workspace = true
scs-teleprompter.workspace = true
scs-video.workspace = true
